# 로그를 제한하지 않으면 컨테이너 로그가 디스크를 채운다. 1vCPU VPS에서 디스크가 차면
# DB까지 같이 멈춘다. 서비스당 최대 30MB(10MB x 3)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.4
    logging: *default-logging
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: UTC
    # 이모지가 들어와도 깨지지 않게 서버 기본 charset을 utf8mb4로 (stack.md §2.2)
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 기본값은 호스트 메모리를 보고 커진다. 작은 VPS에서는 앱과 메모리를 다툰다
      - --innodb-buffer-pool-size=256M
    # 한 컨테이너가 폭주해도 다른 컨테이너를 굶기지 않게 상한을 둔다.
    # 2GB VPS 기준 배분: db 768 + api 640 + web 64 + caddy 128 = 1.6GB, 나머지는 OS 몫
    mem_limit: 768m
    ports:
      # 호스트 3306이 이미 쓰이고 있으면 .env의 MYSQL_PORT만 바꾼다. 컨테이너 안은 항상 3306
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - db-data:/var/lib/mysql
      # 볼륨이 처음 만들어질 때 한 번만 실행된다 (테스트용 DB 생성)
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1로 TCP를 강제한다. 초기화 중 임시 서버는 소켓만 열려 있어서
      # 소켓으로 ping하면 아직 준비 안 됐는데도 성공으로 잡힌다
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build: ./api
    logging: *default-logging
    restart: unless-stopped
    environment:
      # 컨테이너 안에서 DB 주소는 서비스 이름 db다. 127.0.0.1은 자기 자신이라
      # 절대 DB를 못 찾는다 (tasks.md T1.8 함정 ①). .env의 URL은 로컬 실행/테스트용이다
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}?connectionTimeZone=UTC
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      API_TOKEN: ${API_TOKEN}
      # JVM은 컨테이너 메모리 제한을 읽지만 기본이 25%라 640MB 중 160MB만 쓴다.
      # 이 컨테이너에는 JVM 말고 아무것도 없으므로 더 준다
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
      TZ: UTC
    mem_limit: 640m
    depends_on:
      # DB가 healthy가 될 때까지 기다린다. 이게 없으면 앱이 먼저 떠서
      # 연결 실패로 죽는다 (tasks.md T1.8 함정 ②)
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s

  web:
    build: ./web
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      # api가 응답할 때까지 기다린다. 안 그러면 compose up 직후 nginx가 502를 준다
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8081}:80"

  # 배포할 때만 쓴다: docker compose --profile deploy up -d
  # 로컬에서는 web(8081)으로 바로 붙으므로 이 서비스가 뜨지 않는다
  caddy:
    image: caddy:2-alpine
    logging: *default-logging
    profiles: ["deploy"]
    mem_limit: 128m
    restart: unless-stopped
    depends_on:
      - web
      - api
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 인증서를 잃으면 재발급 한도에 걸린다. 반드시 볼륨에 남긴다
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
  db-data:

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.8'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()

    // 테스트는 compose로 띄운 MySQL을 그대로 쓴다. 레포 루트 .env를 실어주지 않으면
    // ./gradlew test 한 줄로 못 돌고, 매번 환경변수를 손으로 넘겨야 한다
    def envFile = file('../.env')
    if (envFile.exists()) {
        def values = [:]
        envFile.readLines().each { line ->
            def m = line =~ /^\s*([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)$/
            if (m) {
                values[m[0][1]] = m[0][2].trim()
            }
        }
        values.each { key, value -> environment key, value }

        // 테스트는 개발용 DB를 건드리면 안 된다. SPRING_DATASOURCE_URL 환경변수는
        // application.yml보다 우선하므로 설정 파일로는 못 이긴다. 여기서 갈아끼운다
        if (values.TEST_DATASOURCE_URL) {
            environment 'SPRING_DATASOURCE_URL', values.TEST_DATASOURCE_URL
        }
    }
}
